<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESP32 Control</title>
</head>
<body style="text-align: center; font-family: sans-serif; background-color: #121212; color: white; margin-top: 50px;">
    <h1>ESP32 Mission Control</h1>
    <p>
        <a href="/red/toggle">
            <button style="font-size: 24px; padding: 20px 40px; margin: 10px; border-radius: 10px; border: none; background: #e74c3c; color: white; cursor: pointer;">Toggle Red</button>
        </a>
    </p>
    <p>
        <a href="/yellow/toggle">
            <button style="font-size: 24px; padding: 20px 40px; margin: 10px; border-radius: 10px; border: none; background: #f1c40f; color: black; cursor: pointer;">Toggle Yellow</button>
        </a>
    </p>
</body>
</html>
